[project]
name = "splat-init"
version = "0.1.0"
description = "Special course at DTU on integrating 360 degree cameras with Gaussian Splatting"
readme = "README.md"
authors = [
    { name = "sarphiv", email = "32750711+sarphiv@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.2.1",
    "einops>=0.8.1",
    "gdown>=5.2.0",
    "hydra-core>=1.3.2",
    "imageio[ffmpeg]>=2.37.0",
    "ipykernel>=6.30.1",
    "ipympl>=0.9.7",
    "ipython>=9.5.0",
    "joblib>=1.5.2",
    "kornia>=0.8.1",
    "lightning>=2.5.5",
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "ninja>=1.13.0",
    "numpy>=1.26.4",
    "omegaconf>=2.3.0",
    "opencv-python>=4.11.0.86",
    "openexr>=3.4.2",
    "pyqt6>=6.9.1",
    "python-pycg>=1.0.1",
    "ray>=2.50.1",
    "rerun-sdk>=0.23.1",
    "timm>=1.0.21",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "tyro>=0.9.31",
    "setuptools",
    "vggt",
    "vipe",
    "viser>=1.0.15",
    "wandb>=0.21.3",
]

[project.scripts]
splat-init = "splat_init:main"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
vggt = { git = "https://github.com/facebookresearch/vggt.git", rev = "e56963328b7476e615ce8dda9164d381f8dc07a3" }
vipe = { path = "vendor/vipe", editable = true }

[tool.uv]
no-build-isolation-package = ["vipe"]

[tool.uv.extra-build-dependencies]
vipe = ["setuptools"]