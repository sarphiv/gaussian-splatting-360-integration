[project]
name = "splat-init"
version = "0.1.0"
description = "Special course at DTU on integrating 360 degree cameras with Gaussian Splatting"
readme = "README.md"
authors = [
    { name = "sarphiv", email = "32750711+sarphiv@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.30.1",
    "ipympl>=0.9.7",
    "ipython>=9.5.0",
    "joblib>=1.5.2",
    "kornia>=0.8.1",
    "lightning>=2.5.5",
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "rerun-sdk>=0.23.1",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "tyro>=0.9.31",
    "vggt",
    "vipe",
    "depth-anything-3",
    "otf-nvs",
    "wandb>=0.21.3",
    "pyqt5>=5.15.11",
    "pyceres>=2.6",
    "pycolmap-cuda12>=3.13.0",
    "torchmetrics[image]>=1.8.2",
]

[project.scripts]
evaluate-poses = "splat_init.evaluate_poses:main"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
vggt = { path = "vendor/vggt", editable = true }
vipe = { path = "vendor/vipe", editable = true } # Must be editable for CLI to even work
depth-anything-3 = { path = "vendor/depth-anything-3", editable = true }
otf-nvs = { path = "vendor/otf-nvs", editable = true }

[tool.uv]
no-build-isolation-package = [
    "vipe",
]
override-dependencies = [
    "nvidia-cuda-runtime-cu12>=12.8.0",  # TODO: Next version after v3.13.0 should fix this
    "nvidia-curand-cu12>=10.3.9.0"  # TODO: Next version after v3.13.0 should fix this
]

[tool.uv.extra-build-dependencies]
pycolmap-cuda12 = [ "pycolmap" ]  # TODO: Next version after v3.13.0 should fix this
diff-gaussian-rasterization = [ "torch", "numpy" ]
fused-ssim = [ "torch" ]
simple-knn = [ "torch" ]
