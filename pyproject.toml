[project]
name = "splat-init"
version = "0.1.0"
description = "Special course at DTU on integrating 360 degree cameras with Gaussian Splatting"
readme = "README.md"
authors = [
    { name = "sarphiv", email = "32750711+sarphiv@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hydra-core>=1.3.2", # 2025-10-4: Needed by ViPE, but does not work under tool.uv.extra-build-dependencies
    "ipykernel>=6.30.1",
    "ipympl>=0.9.7",
    "ipython>=9.5.0",
    "joblib>=1.5.2",
    "kornia>=0.8.1",
    "lightning>=2.5.5",
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "pyqt6>=6.9.1",
    "rerun-sdk>=0.23.1",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "tyro>=0.9.31",
    "vggt",
    "vipe",
    "wandb>=0.21.3",
]

[project.scripts]
splat-init = "splat_init:main"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
vggt = { git = "https://github.com/facebookresearch/vggt.git", rev = "e56963328b7476e615ce8dda9164d381f8dc07a3" }
vipe = { path = "vendor/vipe", editable = true } # Must be editable for CLI to even work

[tool.uv]
no-build-isolation-package = ["vipe"]

[tool.uv.extra-build-dependencies]
vipe = [
    "click",
    "numpy",
    "einops",
    "omegaconf",
    "tqdm",
    "rerun-sdk",
    "imageio[ffmpeg]",
    "opencv-python",
    "matplotlib",
    "python-pycg",
    "timm",
    "transformers",
    "gdown",
    "OpenEXR<3.3.0",
    "kornia",
    "ray",
    "ninja",
    "viser",
]
